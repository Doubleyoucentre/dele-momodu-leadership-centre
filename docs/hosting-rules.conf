# DMLC domain and exported error page. Prepend to the hosting .htaccess;
# retain the existing cPanel-generated PHP directives and HTTPS setting.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/ [NC]
RewriteCond %{HTTP_HOST} ^www\.delemomoducentre\.org$ [NC]
RewriteRule ^ https://delemomoducentre.org%{REQUEST_URI} [R=301,L,NE]
ErrorDocument 404 /404.html
